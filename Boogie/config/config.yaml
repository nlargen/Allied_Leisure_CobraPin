#config_version=6

config: 
 - coils.yaml
 - switches.yaml
 - playfields.yaml
 - balldevices.yaml
 - lights.yaml
 - flippers.yaml

modes:
  - attract
  - base
  # - tilt  # Re-enable with the tilt switch and handler when connected.
  - drop_target_scoring
  - playfield_lights

machine:
  balls_installed: 1

game:
  balls_per_game: 5
  max_players: 2

credits:
  free_play: true

autofire_coils:
  left_slingshot:
    coil: c_slingshot_left
    switch: s_slingshot_left

  right_slingshot:
    coil: c_slingshot_right
    switch: s_slingshot_right
  
  pop_bumper:
    coil: c_pop_bumper
    switch: s_pop_bumper   

hardware:
  platform: opp
  driverboards: gen2

opp:
  ports: COM9, COM10 # Replace with the COM ports Windows assigns to your boards.
  debug: false

 #opp:
 # ports: /dev/ttyACM0, /dev/ttyACM1 # Verify the device paths after connecting the CobraPin boards.
