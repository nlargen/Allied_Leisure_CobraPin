#config_version=6

# CobraPin NEO 0 is the free LED output; the playfield lamps use NEO 1.
# An 8-digit NeoSeg uses 120 channels; the 2-digit ball display uses 30.
# Keep these in physical chain order: player 1, player 2, ball, player 3, player 4.
neoseg_displays:
  player1_neoseg:
    start_channel: 0-0-0
    size: 8digit
    light_template:
      type: w
      subtype: led
  player2_neoseg:
    start_channel: 0-0-120
    size: 8digit
    light_template:
      type: w
      subtype: led
  # ball_neoseg:
  #   start_channel: 0-0-240
  #   size: 2digit
  #   light_template:
  #     type: w
  #     subtype: led
  # player3_neoseg:
  #   start_channel: 0-0-270
  #   size: 8digit
  #   light_template:
  #     type: w
  #     subtype: led
  # player4_neoseg:
  #   start_channel: 0-0-390
  #   size: 8digit
  #   light_template:
  #     type: w
  #     subtype: led

segment_displays:
  player1_display:
    number: 1
    size: 8
    update_method: replace
    integrated_dots: true
    use_dots_for_commas: true
    platform_settings:
      light_groups:
        - player1_neoseg
      type: 14segment
  player2_display:
    number: 2
    size: 8
    update_method: replace
    integrated_dots: true
    use_dots_for_commas: true
    platform_settings:
      light_groups:
        - player2_neoseg
      type: 14segment
