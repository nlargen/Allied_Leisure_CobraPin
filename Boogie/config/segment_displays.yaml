segment_display_player:
  player_added{num==1}:
    player1_display:
      text: "{players[0].score:d}"
  player_added{num==2}:
    player2_display:
      text: "{players[1].score:d}"
  # player_added{num==3}:
  #   player3_display:
  #     text: "{players[2].score:d}"
  # player_added{num==4}:
  #   player4_display:
  #     text: "{players[3].score:d}"
  player_score{player_num==1}:
    player1_display:
      text: "{players[0].score:d}"
  player_score{player_num==2}:
    player2_display:
      text: "{players[1].score:d}"
