#config_version=6

mode:
  start_events: machine_reset_phase_3, game_ended
  stop_events: game_started
  priority: 10
  game_mode: false
  stop_on_ball_end: false

show_player:
  mode_attract_started:
    attract_lights:
      loops: -1

shows:
  attract_lights:
    - time: 0
      lights:
        l_500_when_lit_1: off
        l_500_when_lit_2: off
        l_500_when_lit_3: off
        l_gates_open: &light_color ffbf00 # amber
    - time: +250ms
      lights:
        l_gates_open: off
        l_double_bonus: *light_color
    - time: +250ms
      lights:
        l_double_bonus: off
        l_bonus_5000: *light_color
    - time: +250ms
      lights:
        l_bonus_5000: off
        l_bonus_4000: *light_color
        l_bonus_6000: *light_color
