#config_version=6

mode:
  start_events: ball_starting
  priority: 100

variable_player:
  # left and right 500 point targets
  s_500_ab_1_active:
    score: 500
    ab_1_hit: 
      int: 1
      action: set
  s_500_ab_2_active:
    score: 500
    ab_2_hit: 
      int: 1
      action: set
  s_500_ab_3_active:
    score: 500
    ab_3_hit: 
      int: 1
      action: set  
  s_500_ab_4_active:
    score: 500
    ab_4_hit: 
      int: 1
      action: set    
  s_500_ab_5_active:
    score: 500
    ab_5_hit: 
      int: 1
      action: set    
  s_500_ab_6_active:
    score: 500
    ab_6_hit: 
      int: 1
      action: set    
  s_500_ab_7_active:
    score: 500
    ab_7_hit: 
      int: 1
      action: set    
  s_500_ab_8_active:
    score: 500 
    ab_8_hit: 
      int: 1
      action: set  

  # top rollover switches       
  s_50_rollover_1_active:
    rollover_1_hit: 
      int: 1
      action: set 
  s_50_rollover_2_active:
    rollover_2_hit: 
      int: 1
      action: set  
  s_50_rollover_3_active:
    rollover_3_hit: 
      int: 1
      action: set

  # ten point targets at top of playfield                    
  s_10_top_active:
    score: 10
    10_top_1_hit:
      int: 1
      action: set

  #drop target rollover switch
  s_raise_target_a_og_active: 
    score: 50
    raise_target_a_og_hit: 
      int: 1
      action: set    
  s_raise_target_d_og_active: 
    score: 50
    raise_target_d_og_hit: 
      int: 1
      action: set  
  s_raise_target_b_active: 
    score: 50
    s_raise_target_b_hit: 
      int: 1 
      action: set 
  s_raise_target_c_active: 
    score: 50
    s_raise_target_c_hit:
      int: 1
      action: set

  # rollover target scoring
  s_500_rollover_1_active:
    score: 500
  s_500_rollover_2_active: 
    score: 500      

  # pop bumper hit
  s_pop_bumper_active: 
    score: 50

  #slingshot scoring
  s_slingshot_left_active: 
    score: 50

  s_slingshot_right_active: 
    score: 50

  # drop target scoring
  # see python    

  # Re-enable when the tilt switch is connected and the tilt mode is restored.
  # s_tilt_active:
  #   score: -5000

  # ball in playfield
  s_ball_in_playfield_active: 
    s_ball_in_playfield_hit: 
      int: 1
      action: set  

  # Re-enable when the credit switch is connected.
  # s_credit_active:
  #   s_credit_hit:
  #     int: 1
  #     action: set

accruals: 
  left_bank: 
    events: 
      - s_500_ab_1_active
      - s_500_ab_2_active
      - s_500_ab_3_active
      - s_500_ab_4_active
    events_when_complete: left_bank_complete
    reset_on_complete: false
  right_bank:
    events: 
      - s_500_ab_5_active
      - s_500_ab_6_active
      - s_500_ab_7_active
      - s_500_ab_8_active
    events_when_complete: right_bank_complete
    reset_on_complete: false  

  #when rollover hit raise target
  raise_target_a:
    events: 
      - s_raise_target_a_og_active
    events_when_complete: 
      - raise_target_a_complete
      - open_gate_a  
    reset_on_complete: true
    disable_on_complete: false
  raise_target_b:
    events:
      - s_raise_target_b_active
    events_when_complete:
      - raise_target_b_complete
    reset_on_complete: true
    disable_on_complete: false
  raise_target_c:
    events:
      - s_raise_target_c_active
    events_when_complete: 
      - raise_target_c_complete       
    reset_on_complete: true
    disable_on_complete: false
  raise_target_d:
    events: 
      - s_raise_target_d_og_active
    events_when_complete: 
      - raise_target_d_complete
      - open_gate_d  
    reset_on_complete: true
    disable_on_complete: false

  # Disabled while the thumper is disconnected.
  # trigger_ball_in_play:
  #   events:
  #     - s_ball_in_playfield_active
  #   events_when_complete:
  #     - trigger_thumper
  #   reset_on_complete: true

coil_player:
  s_10_top_active: c_chime_10

  # 50-point awards
  s_raise_target_a_og_active: c_chime_10
  s_raise_target_d_og_active: c_chime_10
  s_raise_target_b_active: c_chime_10
  s_raise_target_c_active: c_chime_10
  s_pop_bumper_active: c_chime_10
  s_slingshot_left_active: c_chime_10
  s_slingshot_right_active: c_chime_10

  # 500-point awards
  s_500_ab_1_active: c_chime_100
  s_500_ab_2_active: c_chime_50
  s_500_ab_3_active: c_chime_100
  s_500_ab_4_active: c_chime_50
  s_500_ab_5_active: c_chime_100
  s_500_ab_6_active: c_chime_50
  s_500_ab_7_active: c_chime_100
  s_500_ab_8_active: c_chime_50
  s_500_rollover_1_active: c_chime_50
  s_500_rollover_2_active: c_chime_50

  open_gate_d:
    c_gate_b:
      action: enable
      hold_power: 0.38
  open_gate_a:
    c_gate_a:
      action: enable
      hold_power: 0.38
  s_close_gate_1_active:
    c_gate_a: disable
  s_close_gate_2_active:
    c_gate_b: disable
  ball_drain:
    c_gate_a: disable
    c_gate_b: disable
  ball_will_end:
    c_gate_a: disable
    c_gate_b: disable
  raise_target_a_complete: c_drop_target_1
  raise_target_b_complete: c_drop_target_2
  raise_target_c_complete: c_drop_target_3
  raise_target_d_complete: c_drop_target_4
  # Disabled while the thumper is disconnected.
  # trigger_thumper: c_thumper
